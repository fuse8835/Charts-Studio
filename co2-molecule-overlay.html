  window.__chartSeek = function (ms) { return window.__chartRealSeek ? window.__chartRealSeek(ms) : false; };

:root {
  --ash-950: #05131f;
  --ash-900: #071b2c;
  --ash-800: #0b2740;
  --ocean-500: #07669e;
  --mint-400: #04ffba;
  --mint-300: #6dffdb;
  --mist-400: #7ea0bd;
  --mist-300: #a9c2d6;
  --paper-100: #eef3fa;
  --paper-050: #f8fbff;
  --line: rgba(169,194,214,.16);
  --panel-w: 392px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
  font-weight: 500;
  color: var(--paper-100);
  background:
    radial-gradient(120% 90% at 6% 4%, rgba(7,102,158,.30), transparent 55%),
    radial-gradient(90% 70% at 98% 100%, rgba(4,255,186,.12), transparent 60%),
    linear-gradient(160deg, #071b2c, #05131f 55%, #01060c);
  overflow: hidden;
}
html.export-mode, html.export-mode body { background: transparent !important; overflow: hidden; }
html.export-mode .app { display: none !important; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 18px;
  padding: 10px 18px; border-bottom: 1px solid var(--line);
  background: rgba(5,19,31,.55); backdrop-filter: blur(6px);
}
.topbar .back { color: var(--mist-300); text-decoration: none; font-weight: 600; font-size: 15px; white-space: nowrap; }
.topbar .back:hover { color: var(--mint-300); }
.topbar h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .01em; color: var(--paper-050); white-space: nowrap; }
.topbar h1 small { font-size: 14px; font-weight: 500; color: var(--mist-400); margin-left: 10px; letter-spacing: .04em; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 0; }
.status { font-size: 14px; color: var(--mist-300); max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status.err { color: #ff9aa8; }
.status.ok { color: var(--mint-300); }

.btn {
  font: inherit; font-weight: 600; font-size: 15px; letter-spacing: .02em;
  color: var(--paper-100); background: rgba(169,194,214,.10);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.btn:hover { background: rgba(169,194,214,.18); border-color: rgba(169,194,214,.35); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { color: #03231b; background: linear-gradient(180deg, var(--mint-300), var(--mint-400)); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { font-size: 13px; padding: 4px 9px; border-radius: 6px; }
.btn.danger:hover { border-color: #ff7a8c; color: #ffb3bd; }

/* ---------- layout ---------- */
.main { display: grid; grid-template-columns: minmax(0,1fr) var(--panel-w); min-height: 0; }
.stage-col { display: grid; grid-template-rows: minmax(0,1fr) auto; min-width: 0; min-height: 0; }
.stage-wrap { position: relative; display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 0; }
.stage {
  position: relative; overflow: hidden; border-radius: 10px;
  box-shadow: 0 0 0 1px var(--line), 0 18px 50px rgba(0,0,0,.45);
  background: #0a1c2c; cursor: crosshair; touch-action: none;
}
.stage .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
.checker {
  display: none;
  background-color: #1b2b3a;
  background-image:
    linear-gradient(45deg, #263a4d 25%, transparent 25%, transparent 75%, #263a4d 75%),
    linear-gradient(45deg, #263a4d 25%, transparent 25%, transparent 75%, #263a4d 75%);
  background-size: 28px 28px; background-position: 0 0, 14px 14px;
}
.stage[data-bg="checker"] .checker { display: block; }
.stage[data-bg="navy"] { background: #05131f; }

<body>
<div class="app" id="app">
  <header class="topbar">
    <a class="back" href="explainers.html">← Explainers</a>
    <h1>CO₂ molecule overlay <small>3D PARTICLE EXPLAINER</small></h1>
    <div class="top-actions">
      <span class="status" id="status"></span>
      <button class="btn primary" id="btnRender" type="button" title="Capture the overlay as a transparent ProRes 4444 .mov via the render server">Render .mov</button>
    </div>
  </header>

  <main class="main">
    <section class="stage-col">
      <div class="stage-wrap" id="stageWrap">
        <div class="stage" id="stage" data-bg="media" data-kind="image">
          <div class="layer checker"></div>
          <img class="layer bg-media" id="bgImg" alt="">
          <video class="layer bg-media" id="bgVid" muted loop playsinline></video>
          <canvas class="layer" id="gl"></canvas>
          <svg class="layer" id="guides"></svg>
          <div class="stage-hint">Click to move the source · Shift-click to add another · drag the arrow tip to aim</div>
        </div>
      </div>
      <div class="transport">
        <button class="btn small" id="btnPlay" type="button" title="Space">Pause</button>
        <button class="btn small" id="btnRestart" type="button">⟲</button>
        <input type="range" id="scrub" min="0" max="10" step="0.01" value="0" aria-label="Timeline">

        <span class="stats" id="stats"></span>
        <label><input type="checkbox" id="chkGuides" checked> Guides</label>
        <button class="btn small" id="btnPng" type="button" title="Transparent PNG of the current frame at output resolution">Save PNG</button>
      </div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
</div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================================
   CO₂ molecule overlay
   -------------------------------------------------------------------------------------
   Everything on screen is a pure function of (settings, sources, t): no accumulated state,
   no Math.random(), no wall-clock. That is what makes preview scrubbing, the seamless loop
   and the frame-exact .mov capture all agree with each other (the render server calls
   window.__chartSeek(ms) for every frame instead of seeking CSS animations).
   ===================================================================================== */

const EXPORT = document.documentElement.classList.contains('export-mode');
const $ = (s, r = document) => r.querySelector(s);
const D2R = Math.PI / 180;
const WORLD_H = 100;            // visible height of the z = 0 plane, in world units (1 unit = 1% of frame height)
const MAXM = 3500;              // hard cap on molecules drawn per frame

/* ---------------------------------------------------------------- defaults & presets */
const DEFAULTS = {
  // generation
  rate: 6, qty: 2, burst: 0.85, life: 9, lifeVar: 0.25, emitR: 2.5, warm: true, seed: 7,
  // flow
  angle: 181, tilt: 0, speed: 16, speedVar: 0.35, drag: 0.08, buoy: -0.15, windStr: 2.5, windAngle: 183,
  // spread
  cone: 22, diffusion: 2.2, turb: 2.2, turbFreq: 0.35, depth: 28,
  // molecule
  cCol: '#dfe4ea', oCol: '#f2b3a8', bCol: '#b8c2ce',
  size: 4.6, sizeVar: 0.45, atomSize: 0.62, bonds: 'double', bondThick: 0.085, bondAngle: 104, endScale: 1.15, molShow: true,
  orient: 'tumble', tumble: 0.9,
  // glowing network
  netOn: false, netNodes: 'molecule', netDist: 15, netMax: 3, netDelay: 0.15, netCol: '#6dffdb',
  netWidth: 0.22, netNode: 1, netGlow: 1, netOpacity: 0.85, netPulse: 0.5, netPulseSpeed: 0.8,
  // opacity & lighting
  opacity: 0.95, fadeIn: 0.6, fadeOut: 1.8, gloss: 0.55, lightAngle: 125, key: 2.4, ambient: 1.5, rim: 1.2, fov: 28,
  // output
  duration: 10, loop: true, res: '1920x1080', fps: 30, name: 'co2-molecules',
  // preview only
  bgMode: 'media',
};
const DEFAULT_SOURCES = [{ x: 0.80, y: 0.33, z: 0 }];

const MOTION_KEYS = ['rate','qty','burst','life','lifeVar','emitR','warm','angle','tilt','speed','speedVar','drag','buoy',
  'windStr','windAngle','cone','diffusion','turb','turbFreq','depth','size','sizeVar','atomSize','bonds','bondThick','bondAngle',
  'endScale','orient','tumble','opacity','fadeIn','fadeOut'];

const PRESETS = {
  'Smokestack drift':  { },
  'Gentle haze':       { rate: 3, qty: 1, burst: 1, life: 9, speed: 3.5, cone: 70, diffusion: 4, turb: 3.2, turbFreq: 0.25, buoy: 0.8, windStr: 1.5, size: 4, sizeVar: 0.7, opacity: 0.85, fadeIn: 1.2, fadeOut: 3, tumble: 0.5, depth: 40 },
  'Exhaust puffs':     { rate: 0.7, qty: 16, burst: 0, life: 5, speed: 22, speedVar: 0.5, drag: 1.4, cone: 38, diffusion: 3, turb: 1.5, buoy: 0.4, windStr: 1, size: 4.2, fadeIn: 0.25, fadeOut: 1.6, tumble: 1.8, emitR: 1.2 },
  'Rising column':     { angle: 90, rate: 6, qty: 2, speed: 11, cone: 9, diffusion: 1.4, turb: 1.6, buoy: 2.2, windStr: 0, drag: 0.1, life: 6, tumble: 0.8 },
  'Dense cloud':       { rate: 12, qty: 4, burst: 1, life: 8, speed: 7, cone: 30, diffusion: 3.4, turb: 2.4, size: 3.6, sizeVar: 0.75, opacity: 0.9, fadeOut: 2.2, depth: 46 },
  'Flat labels (2D feel)': { bondAngle: 180, orient: 'fixed', tumble: 0, depth: 14, fov: 14, size: 5, sizeVar: 0.6, bonds: 'none', atomSize: 0.7, gloss: 0.2, key: 1.6, ambient: 2.2, rim: 0.4 },
};

/* ---------------------------------------------------------------- state */
let S = { ...DEFAULTS };
let sources = DEFAULT_SOURCES.map(s => ({ ...s }));
let selected = 0;
let playing = true;
let tNow = 0;
let aspect = 16 / 9;
let lastCount = 0, capHit = false;

const STORE_KEY = 'co2overlay.v1';
const PRESET_KEY = 'co2overlay.presets';
function loadStore(key, fallback) { try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; } catch (e) { return fallback; } }
function saveStore(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage unavailable: fine */ } }

function mergeConfig(cfg) {
  if (!cfg || typeof cfg !== 'object') return;
  const st = cfg.settings || {};
  for (const k of Object.keys(DEFAULTS)) {
    if (k in st && typeof st[k] === typeof DEFAULTS[k]) S[k] = st[k];
  }
  if (Array.isArray(cfg.sources) && cfg.sources.length) {
    sources = cfg.sources.slice(0, 12).map(s => ({
      x: Math.min(1.5, Math.max(-0.5, +s.x || 0)), y: Math.min(1.5, Math.max(-0.5, +s.y || 0)), z: +s.z || 0,
    }));
  }
}
const currentConfig = () => ({ v: 1, settings: { ...S }, sources: sources.map(s => ({ ...s })) });

if (EXPORT) {
  try {
    const raw = new URLSearchParams(location.search).get('cfg');
    if (raw) mergeConfig(JSON.parse(atob(raw.replace(/-/g, '+').replace(/_/g, '/'))));
  } catch (e) { console.error('Bad cfg parameter', e); }
} else {
  mergeConfig(loadStore(STORE_KEY, null));
}
selected = 0;

/* ---------------------------------------------------------------- three.js scene */
const canvas = $('#gl');
if (EXPORT) {
  document.body.appendChild(canvas);
  canvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;display:block;';
}
const renderer = new THREE.WebGLRenderer({
  canvas, alpha: true, antialias: true, premultipliedAlpha: true, preserveDrawingBuffer: EXPORT,
});
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(S.fov, aspect, 1, 6000);
const hemi = new THREE.HemisphereLight(0xffffff, 0xaab6c6, 1);
const keyL = new THREE.DirectionalLight(0xffffff, 1);
const rimL = new THREE.DirectionalLight(0xdbe8ff, 1);
scene.add(hemi, keyL, rimL);

function patchAlpha(mat, clip) {
  mat.onBeforeCompile = (sh) => {
    let vs = sh.vertexShader, fs = sh.fragmentShader;
    vs = vs
      .replace('#include <common>', '#include <common>\nattribute float instanceAlpha;\nvarying float vIA;' +
        (clip ? '\nattribute vec3 iCA;\nattribute vec3 iCB;\nattribute vec2 iRad;\nvarying vec3 vWP;\nvarying vec3 vCA;\nvarying vec3 vCB;\nvarying vec2 vRad;' : ''))
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvIA = instanceAlpha;' +
        (clip ? '\nvWP = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;\nvCA = iCA; vCB = iCB; vRad = iRad;' : ''));
    fs = fs
      .replace('#include <common>', '#include <common>\nvarying float vIA;' + (clip ? '\nvarying vec3 vWP;\nvarying vec3 vCA;\nvarying vec3 vCB;\nvarying vec2 vRad;' : ''))
      .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.a *= vIA;');
    // Bonds run centre-to-centre, then every fragment that lies inside either atom is discarded, so a
    // bond ends exactly on the atom surface and never shows through a see-through atom.
    if (clip) fs = fs.replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif (distance(vWP, vCA) < vRad.x || distance(vWP, vCB) < vRad.y) discard;');
    sh.vertexShader = vs; sh.fragmentShader = fs;
  };
  mat.customProgramCacheKey = () => (clip ? 'co2-clip' : 'co2-plain');
  return mat;
}
const mkMat = (clip) => patchAlpha(new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0, transparent: true, depthWrite: true }), clip);
const matC = mkMat(false), matO = mkMat(false), matB = mkMat(true);

function mkInstanced(geo, mat, cap) {
  geo.setAttribute('instanceAlpha', new THREE.InstancedBufferAttribute(new Float32Array(cap).fill(1), 1));
  const m = new THREE.InstancedMesh(geo, mat, cap);
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.geometry.attributes.instanceAlpha.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled = false;
  m.count = 0;
  scene.add(m);
  return m;
}
const sphere = () => new THREE.SphereGeometry(1, 28, 18);
const meshC = mkInstanced(sphere(), matC, MAXM);
const meshO = mkInstanced(sphere(), matO, MAXM * 2);
const BONDCAP = MAXM * 4;
const meshB = mkInstanced(new THREE.CylinderGeometry(1, 1, 1, 14, 1, false).rotateZ(Math.PI / 2), matB, BONDCAP);
[['iCA', 3], ['iCB', 3], ['iRad', 2]].forEach(([name, size]) => {
  const at = new THREE.InstancedBufferAttribute(new Float32Array(BONDCAP * size), size);
  at.setUsage(THREE.DynamicDrawUsage);
  meshB.geometry.setAttribute(name, at);
});

/* ---------------------------------------------------------------- glowing network (links + nodes) */
const LINKCAP = 9000, NODECAP = MAXM * 3;
const netU = {
  uColor: { value: new THREE.Color('#6dffdb') }, uGlow: { value: 1 }, uPulse: { value: 0.5 },
  uTime: { value: 0 }, uSpeed: { value: 0.8 }, uFreq: { value: 1 / 6 }, uHalf: { value: 1 },
};
const netBlend = {
  transparent: true, depthWrite: false, depthTest: true, blending: THREE.CustomBlending,
  blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
  side: THREE.DoubleSide,   // the link quads are built facing away from the camera, so culling would remove them all
};
// Output is premultiplied alpha, so the glow composites correctly over any footage.
const linkMat = new THREE.ShaderMaterial({
  uniforms: netU, ...netBlend,
  vertexShader: `
    attribute vec3 iA; attribute vec3 iB; attribute vec2 iD;
    uniform float uHalf;
    varying vec2 vC; varying float vAlpha; varying float vPhase;
    void main() {
      vec3 P = mix(iA, iB, position.x);
      vec3 dir = iB - iA; float len = length(dir);
      dir = len > 1e-5 ? dir / len : vec3(1.0, 0.0, 0.0);
      vec3 toCam = normalize(cameraPosition - P);
      vec3 side = cross(dir, toCam); float sl = length(side);
      side = sl > 1e-4 ? side / sl : vec3(0.0, 1.0, 0.0);
      P += side * position.y * uHalf;
      vC = vec2(position.x * len, position.y); vAlpha = iD.x; vPhase = iD.y;
      gl_Position = projectionMatrix * viewMatrix * vec4(P, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 uColor; uniform float uGlow; uniform float uPulse; uniform float uTime; uniform float uSpeed; uniform float uFreq;
    varying vec2 vC; varying float vAlpha; varying float vPhase;
    void main() {
      float d = abs(vC.y);
      float core = exp(-pow(d / 0.24, 2.0));
      float halo = exp(-pow(d / 0.72, 2.0)) * 0.55 * uGlow * (1.0 - smoothstep(0.6, 1.0, d));
      float I = core + halo;
      float ph = fract(vC.x * uFreq - uTime * uSpeed + vPhase);
      float pulse = pow(0.5 + 0.5 * sin(6.2831853 * ph), 4.0);
      I *= mix(1.0, 0.35 + 1.5 * pulse, uPulse);
      I = clamp(I * vAlpha, 0.0, 1.0);
      gl_FragColor = vec4(uColor * I, I);
    }`,
});
const nodeMat = new THREE.ShaderMaterial({
  uniforms: netU, ...netBlend,
  vertexShader: `
    attribute vec3 iP; attribute vec2 iD;
    varying vec2 vC; varying float vAlpha;
    void main() {
      vec4 mv = viewMatrix * vec4(iP, 1.0);
      mv.z += iD.y * 0.5;            // sit just in front of the atom so the glow isn't hidden inside it
      mv.xy += position.xy * iD.y;
      vC = position.xy; vAlpha = iD.x;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform vec3 uColor; uniform float uGlow;
    varying vec2 vC; varying float vAlpha;
    void main() {
      float r = length(vC);
      float core = exp(-r * r * 22.0);
      float halo = exp(-r * r * 5.0) * 0.6 * uGlow;
      float I = clamp((core * 1.3 + halo) * (1.0 - smoothstep(0.7, 1.0, r)) * vAlpha, 0.0, 1.0);
      gl_FragColor = vec4(mix(uColor, vec3(1.0), core * 0.5) * I, I);
    }`,
});
function mkNetGeo(quad, attrs, cap) {
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(quad), 3));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  const arrays = {};
  attrs.forEach(([name, size]) => {
    const a = new Float32Array(cap * size);
    const at = new THREE.InstancedBufferAttribute(a, size); at.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute(name, at); arrays[name] = a;
  });
  g.instanceCount = 0;
  return { g, arrays };
}
const linkG = mkNetGeo([0, -1, 0, 1, -1, 0, 1, 1, 0, 0, 1, 0], [['iA', 3], ['iB', 3], ['iD', 2]], LINKCAP);
const nodeG = mkNetGeo([-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, 1, 0], [['iP', 3], ['iD', 2]], NODECAP);
const linkMesh = new THREE.Mesh(linkG.g, linkMat), nodeMesh = new THREE.Mesh(nodeG.g, nodeMat);
[linkMesh, nodeMesh].forEach((m, i) => { m.frustumCulled = false; m.renderOrder = 2 + i; scene.add(m); });


function applyLook() {
  matC.color.set(S.cCol); matO.color.set(S.oCol); matB.color.set(S.bCol);
  const rough = 1 - S.gloss * 0.82;
  matC.roughness = matO.roughness = matB.roughness = rough;
  hemi.intensity = S.ambient;
  keyL.intensity = S.key;
  rimL.intensity = S.rim;
  const a = S.lightAngle * D2R;
  keyL.position.set(Math.cos(a) * 60, Math.sin(a) * 60, 70);
  rimL.position.set(-Math.cos(a) * 50, -Math.sin(a) * 50, -60);
  camera.fov = S.fov;
  camera.position.set(0, 0, (WORLD_H / 2) / Math.tan(S.fov * 0.5 * D2R));
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}

/* ---------------------------------------------------------------- deterministic RNG */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash4(a, b, c, d) {
  let h = Math.imul(a, 374761393) ^ Math.imul(b + 17, 668265263) ^ Math.imul(c + 101, 2246822519) ^ Math.imul(d + 977, 3266489917);
  h = Math.imul(h ^ (h >>> 15), 2246822519);
  h = Math.imul(h ^ (h >>> 13), 3266489917);
  return (h ^ (h >>> 16)) >>> 0;
}

/* ---------------------------------------------------------------- simulation */
// per-molecule output, structure-of-arrays
const M = {
  x: new Float32Array(MAXM), y: new Float32Array(MAXM), z: new Float32Array(MAXM),
  qx: new Float32Array(MAXM), qy: new Float32Array(MAXM), qz: new Float32Array(MAXM), qw: new Float32Array(MAXM),
  s: new Float32Array(MAXM), a: new Float32Array(MAXM), u: new Float32Array(MAXM), e: new Float32Array(MAXM),
};
const ss = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
const posMod = (a, n) => ((a % n) + n) % n;

function axisAngle(ax, ay, az, ang) { const h = ang * 0.5, s = Math.sin(h); return [ax * s, ay * s, az * s, Math.cos(h)]; }
function qmul(a, b) {
  return [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
  ];
}

function collect(t) {
  const nS = sources.length;
  const T = S.duration, loop = S.loop;
  const th = S.angle * D2R, ph = S.tilt * D2R;
  const dX = Math.cos(ph) * Math.cos(th), dY = Math.cos(ph) * Math.sin(th), dZ = Math.sin(ph);
  // orthonormal basis (d, p, q) for the emission cone
  let pX = dY * 0 - dZ * 1, pY = dZ * 0 - dX * 0, pZ = dX * 1 - dY * 0;   // d × (0,1,0) = (-dZ, 0, dX)
  let pl = Math.hypot(pX, pY, pZ);
  if (pl < 1e-3) { pX = 0; pY = 0; pZ = 1; pl = 1; }
  pX /= pl; pY /= pl; pZ /= pl;
  const qX = dY * pZ - dZ * pY, qY = dZ * pX - dX * pZ, qZ = dX * pY - dY * pX;
  const wa = S.windAngle * D2R, wX = Math.cos(wa) * S.windStr, wY = Math.sin(wa) * S.windStr;
  const cone = S.cone * D2R;
  const LmaxRaw = S.life * (1 + S.lifeVar);
  const Lmax = loop ? Math.min(LmaxRaw, T * 0.999) : LmaxRaw;
  const Q = S.qty;
  const worldW = WORLD_H * aspect;

  let n = 0;
  capHit = false;

  const emitMolecule = (si, k, q, birth, age, rnd) => {
    // rnd() order is fixed: every draw below is consumed unconditionally so a given molecule's look
    // never depends on the other settings.
    const rLife = rnd();
    let L = S.life * (1 + S.lifeVar * (2 * rLife - 1));
    L = Math.max(0.25, loop ? Math.min(L, T * 0.999) : L);
    if (age < 0 || age > L) return;
    if (n >= MAXM) { capHit = true; return; }

    const rSpeed = rnd(), rCone = rnd(), rAz = rnd(), rSize = rnd();
    const u1 = rnd(), u2 = rnd(), u3 = rnd();                // orientation (Shoemake)
    const ax1 = rnd(), ax2 = rnd(), rOmega = rnd();          // tumble axis + rate
    const f1 = rnd(), f2 = rnd(), f3 = rnd(), f4 = rnd(), f5 = rnd();   // turbulence phases
    const g1 = rnd(), g2 = rnd();                            // diffusion (gaussian pair)
    const eA = rnd(), eR = rnd(), rz = rnd();                // emitter disc + depth scatter

    const src = sources[si];
    const sx = (src.x - 0.5) * worldW, sy = (0.5 - src.y) * WORLD_H;

    const u = age / L;

    // direction within the cone
    const beta = cone * Math.sqrt(rCone), az = rAz * Math.PI * 2;
    const cb = Math.cos(beta), sb = Math.sin(beta), ca = Math.cos(az), sa = Math.sin(az);
    const dirX = dX * cb + (pX * ca + qX * sa) * sb;
    const dirY = dY * cb + (pY * ca + qY * sa) * sb;
    const dirZ = dZ * cb + (pZ * ca + qZ * sa) * sb;

    const v0 = Math.max(0, S.speed * (1 + S.speedVar * (2 * rSpeed - 1)));
    const travel = S.drag > 1e-3 ? v0 * (1 - Math.exp(-S.drag * age)) / S.drag : v0 * age;

    // emitter disc (screen plane) + depth scatter
    const er = Math.sqrt(eR) * S.emitR, ea = eA * Math.PI * 2;
    let px = sx + Math.cos(ea) * er, py = sy + Math.sin(ea) * er;
    let pz = (src.z || 0) + (2 * rz - 1) * S.depth * 0.5;

    px += dirX * travel + wX * age;
    py += dirY * travel + wY * age + 0.5 * S.buoy * age * age;
    pz += dirZ * travel;

    // turbulence: smooth, bounded, grows as the plume disperses
    const ta = S.turb * (0.35 + 0.65 * Math.sqrt(u));
    const w = Math.PI * 2 * S.turbFreq * age;
    px += ta * (Math.sin(w + f1 * 6.2832) * 0.7 + Math.sin(w * 1.9 + f2 * 6.2832) * 0.3);
    py += ta * (Math.sin(w + f3 * 6.2832) * 0.7 + Math.sin(w * 1.9 + f4 * 6.2832) * 0.3);
    pz += ta * 0.6 * Math.sin(w * 1.3 + f5 * 6.2832);

    // diffusion: random-walk-like lateral widening ~ sqrt(age)
    const rad = Math.sqrt(-2 * Math.log(Math.max(1e-6, g1))), gx = rad * Math.cos(6.2832 * g2), gy = rad * Math.sin(6.2832 * g2);
    const dd = S.diffusion * Math.sqrt(age);
    px += (pX * gx + qX * gy) * dd; py += (pY * gx + qY * gy) * dd; pz += (pZ * gx + qZ * gy) * dd;

    // orientation
    let quat;
    const omega = S.tumble * (0.5 + rOmega);
    if (S.orient === 'tumble') {
      const sq1 = Math.sqrt(1 - u1), sq2 = Math.sqrt(u1);
      const q0 = [sq1 * Math.sin(6.2832 * u2), sq1 * Math.cos(6.2832 * u2), sq2 * Math.sin(6.2832 * u3), sq2 * Math.cos(6.2832 * u3)];
      const az2 = ax2 * 6.2832, zz = 2 * ax1 - 1, rr = Math.sqrt(1 - zz * zz);
      quat = qmul(axisAngle(rr * Math.cos(az2), rr * Math.sin(az2), zz, omega * age), q0);
    } else if (S.orient === 'screen') {
      quat = axisAngle(0, 0, 1, u2 * 6.2832 + (2 * rOmega - 1) * S.tumble * age);
    } else if (S.orient === 'flow') {
      let vx = px - sx, vy = py - sy, vz = pz - (src.z || 0);
      let vl = Math.hypot(vx, vy, vz);
      if (vl < 1e-4) { vx = dirX; vy = dirY; vz = dirZ; vl = 1; }
      vx /= vl; vy /= vl; vz /= vl;
      const qf = (vx < -0.9999) ? [0, 1, 0, 0] : (() => { const l = Math.hypot(0, -vz, vy, 1 + vx); return [0, -vz / l, vy / l, (1 + vx) / l]; })();
      quat = qmul(qf, axisAngle(1, 0, 0, omega * age));
    } else {
      quat = [0, 0, 0, 1];
    }

    // size and opacity envelopes
    let sz = S.size * Math.max(0.25, 1 + S.sizeVar * (2 * rSize - 1) * 0.9);
    sz *= 1 + (S.endScale - 1) * ss(0, 1, u);
    const fi = S.fadeIn > 0 ? ss(0, 1, age / S.fadeIn) : 1;
    const fo = S.fadeOut > 0 ? ss(0, 1, (L - age) / S.fadeOut) : 1;
    sz *= 0.55 + 0.45 * fi;
    const alpha = S.opacity * fi * fo;
    if (alpha < 0.004) return;

    M.x[n] = px; M.y[n] = py; M.z[n] = pz;
    M.qx[n] = quat[0]; M.qy[n] = quat[1]; M.qz[n] = quat[2]; M.qw[n] = quat[3];
    M.s[n] = sz; M.a[n] = alpha; M.u[n] = u; M.e[n] = fi * fo;
    n++;
  };

  for (let si = 0; si < nS; si++) {
    if (loop) {
      const E = Math.max(1, Math.round(S.rate * T));
      for (let k = 0; k < E; k++) {
        for (let q = 0; q < Q; q++) {
          const rnd = mulberry32(hash4(S.seed, si, k, q));
          const r0 = rnd();
          const birth = ((k + r0 * S.burst) * T) / E;
          emitMolecule(si, k, q, birth, posMod(t - birth, T), rnd);
        }
      }
    } else {
      let kmin = Math.floor((t - Lmax) * S.rate) - 1;
      const kmax = Math.ceil(t * S.rate) + 1;
      if (!S.warm) kmin = Math.max(kmin, 0);
      for (let k = kmin; k <= kmax; k++) {
        for (let q = 0; q < Q; q++) {
          const rnd = mulberry32(hash4(S.seed, si, k, q));
          const r0 = rnd();
          const birth = (k + r0 * S.burst) / S.rate;
          emitMolecule(si, k, q, birth, t - birth, rnd);
        }
      }
    }
  }
  return n;
}

/* ---------------------------------------------------------------- instance writing */
const mC = meshC.instanceMatrix.array, mO = meshO.instanceMatrix.array, mB = meshB.instanceMatrix.array;
const aC = meshC.geometry.attributes.instanceAlpha.array, aO = meshO.geometry.attributes.instanceAlpha.array, aB = meshB.geometry.attributes.instanceAlpha.array;

function putMat(arr, i, c0x, c0y, c0z, c1x, c1y, c1z, c2x, c2y, c2z, sx, sy, sz, tx, ty, tz) {
  const o = i * 16;
  arr[o] = c0x * sx; arr[o + 1] = c0y * sx; arr[o + 2] = c0z * sx; arr[o + 3] = 0;
  arr[o + 4] = c1x * sy; arr[o + 5] = c1y * sy; arr[o + 6] = c1z * sy; arr[o + 7] = 0;
  arr[o + 8] = c2x * sz; arr[o + 9] = c2y * sz; arr[o + 10] = c2z * sz; arr[o + 11] = 0;
  arr[o + 12] = tx; arr[o + 13] = ty; arr[o + 14] = tz; arr[o + 15] = 1;
}

const bCA = meshB.geometry.attributes.iCA.array, bCB = meshB.geometry.attributes.iCB.array, bRad = meshB.geometry.attributes.iRad.array;
const NP = new Float32Array(NODECAP * 3), NW = new Float32Array(NODECAP), NSZ = new Float32Array(NODECAP), NM = new Int32Array(NODECAP);
let nodeN = 0, lastLinks = 0;

function pushNode(x, y, z, w, size, mol) {
  if (nodeN >= NODECAP) return;
  NP[nodeN * 3] = x; NP[nodeN * 3 + 1] = y; NP[nodeN * 3 + 2] = z; NW[nodeN] = w; NSZ[nodeN] = size; NM[nodeN] = mol;
  nodeN++;
}

function writeInstances(n) {
  const idx = new Array(n);
  for (let i = 0; i < n; i++) idx[i] = i;
  idx.sort((a, b) => M.z[a] - M.z[b]);   // far → near, so partly-faded molecules blend in a sensible order

  const rC = S.atomSize * 0.60, rO = S.atomSize * 0.53;
  const bonds = S.bonds === 'none' ? 0 : (S.bonds === 'double' ? 2 : 1);
  // Molecule frame: carbon at the origin, the two oxygens at ±(bond angle / 2) either side of local -y,
  // all in the local xy plane. 180° gives the textbook straight O=C=O along x.
  const half = S.bondAngle * 0.5 * D2R, sH = Math.sin(half), cH = Math.cos(half);
  const atoms = S.netNodes === 'atoms';
  nodeN = 0;
  let ib = 0;
  for (let j = 0; j < n; j++) {
    const i = idx[j];
    const x = M.qx[i], y = M.qy[i], z = M.qz[i], w = M.qw[i];
    const xx = x * x, yy = y * y, zz = z * z, xy = x * y, xz = x * z, yz = y * z, wx = w * x, wy = w * y, wz = w * z;
    const c0x = 1 - 2 * (yy + zz), c0y = 2 * (xy + wz), c0z = 2 * (xz - wy);
    const c1x = 2 * (xy - wz), c1y = 1 - 2 * (xx + zz), c1z = 2 * (yz + wx);
    const c2x = 2 * (xz + wy), c2y = 2 * (yz - wx), c2z = 1 - 2 * (xx + yy);
    const d = M.s[i] * 0.5, px = M.x[i], py = M.y[i], pz = M.z[i], al = M.a[i];

    // world-space offsets of the two oxygens from the carbon
    const o1x = (c0x * sH - c1x * cH) * d, o1y = (c0y * sH - c1y * cH) * d, o1z = (c0z * sH - c1z * cH) * d;
    const o2x = (-c0x * sH - c1x * cH) * d, o2y = (-c0y * sH - c1y * cH) * d, o2z = (-c0z * sH - c1z * cH) * d;

    putMat(mC, j, c0x, c0y, c0z, c1x, c1y, c1z, c2x, c2y, c2z, d * rC, d * rC, d * rC, px, py, pz);
    aC[j] = al;
    putMat(mO, 2 * j, c0x, c0y, c0z, c1x, c1y, c1z, c2x, c2y, c2z, d * rO, d * rO, d * rO, px + o1x, py + o1y, pz + o1z);
    putMat(mO, 2 * j + 1, c0x, c0y, c0z, c1x, c1y, c1z, c2x, c2y, c2z, d * rO, d * rO, d * rO, px + o2x, py + o2y, pz + o2z);
    aO[2 * j] = al; aO[2 * j + 1] = al;

    if (bonds) {
      const rb = S.bondThick * d;
      const off = bonds === 2 ? rb * 1.3 : 0;
      for (let s2 = 0; s2 < 2; s2++) {
        const ux = s2 === 0 ? sH : -sH, uy = -cH;              // bond direction in the molecule's plane
        const vx = -uy, vy = ux;                               // in-plane perpendicular (spaces a double bond)
        const Xx = c0x * ux + c1x * uy, Xy = c0y * ux + c1y * uy, Xz = c0z * ux + c1z * uy;
        const Yx = c0x * vx + c1x * vy, Yy = c0y * vx + c1y * vy, Yz = c0z * vx + c1z * vy;
        const ox = s2 === 0 ? o1x : o2x, oy = s2 === 0 ? o1y : o2y, oz = s2 === 0 ? o1z : o2z;
        for (let b2 = 0; b2 < bonds; b2++) {
          const lo = bonds === 2 ? (b2 === 0 ? -off : off) : 0;
          const mx = px + Xx * d * 0.5 + Yx * lo, my = py + Xy * d * 0.5 + Yy * lo, mz = pz + Xz * d * 0.5 + Yz * lo;
          putMat(mB, ib, Xx, Xy, Xz, Yx, Yy, Yz, c2x, c2y, c2z, d, rb, rb, mx, my, mz);
          aB[ib] = al;
          bCA[ib * 3] = px; bCA[ib * 3 + 1] = py; bCA[ib * 3 + 2] = pz;
          bCB[ib * 3] = px + ox; bCB[ib * 3 + 1] = py + oy; bCB[ib * 3 + 2] = pz + oz;
          bRad[ib * 2] = d * rC * 0.985; bRad[ib * 2 + 1] = d * rO * 0.985;
          ib++;
        }
      }
    }

    if (S.netOn) {
      const wgt = M.e[i] * ss(S.netDelay, S.netDelay + 0.2, M.u[i]);
      if (wgt > 0.01) {
        if (atoms) {
          const sz = d * 0.9 * S.netNode;
          pushNode(px, py, pz, wgt, sz, i);
          pushNode(px + o1x, py + o1y, pz + o1z, wgt, sz, i);
          pushNode(px + o2x, py + o2y, pz + o2z, wgt, sz, i);
        } else {
          pushNode(px, py, pz, wgt, M.s[i] * 0.7 * S.netNode, i);
        }
      }
    }
  }
  const show = S.molShow;
  meshC.count = show ? n : 0; meshO.count = show ? n * 2 : 0; meshB.count = show ? ib : 0;
  meshC.instanceMatrix.needsUpdate = meshO.instanceMatrix.needsUpdate = meshB.instanceMatrix.needsUpdate = true;
  for (const m of [meshC, meshO, meshB]) m.geometry.attributes.instanceAlpha.needsUpdate = true;
  for (const nm of ['iCA', 'iCB', 'iRad']) meshB.geometry.attributes[nm].needsUpdate = true;
}

// Proximity graph over the nodes: each node links to its nearest few neighbours inside the reach, and a
// link's brightness falls off smoothly with distance, so the web drifts and re-forms without popping.
function buildNetwork(t) {
  let ln = 0;
  const lA = linkG.arrays.iA, lB = linkG.arrays.iB, lD = linkG.arrays.iD;
  if (S.netOn && nodeN > 1) {
    const reach = Math.max(0.5, S.netDist), r2 = reach * reach, K = Math.min(8, Math.max(1, S.netMax | 0));
    const cell = new Map();
    for (let i = 0; i < nodeN; i++) {
      const key = (Math.floor(NP[i * 3] / reach) + 2048) * 4096 + (Math.floor(NP[i * 3 + 1] / reach) + 2048);
      let a = cell.get(key); if (!a) { a = []; cell.set(key, a); } a.push(i);
    }
    const seen = new Set(), bj = new Int32Array(8), bd = new Float32Array(8);
    for (let i = 0; i < nodeN && ln < LINKCAP; i++) {
      const xi = NP[i * 3], yi = NP[i * 3 + 1], zi = NP[i * 3 + 2];
      const cx = Math.floor(xi / reach), cy = Math.floor(yi / reach);
      let nb = 0;
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
        const a = cell.get((cx + ox + 2048) * 4096 + (cy + oy + 2048)); if (!a) continue;
        for (let q = 0; q < a.length; q++) {
          const j = a[q]; if (j === i || NM[j] === NM[i]) continue;
          const dx = NP[j * 3] - xi, dy = NP[j * 3 + 1] - yi, dz = (NP[j * 3 + 2] - zi) * 0.3;   // depth counts for less, so the web reads as flat as the picture
          const d2 = dx * dx + dy * dy + dz * dz; if (d2 >= r2) continue;
          if (nb < K || d2 < bd[nb - 1]) {
            let p = nb < K ? nb++ : nb - 1;
            while (p > 0 && bd[p - 1] > d2) { bd[p] = bd[p - 1]; bj[p] = bj[p - 1]; p--; }
            bd[p] = d2; bj[p] = j;
          }
        }
      }
      for (let k = 0; k < nb && ln < LINKCAP; k++) {
        const j = bj[k], key = i < j ? i * 16384 + j : j * 16384 + i;
        if (seen.has(key)) continue; seen.add(key);
        const la = Math.min(NW[i], NW[j]) * ss(reach, reach * 0.55, Math.sqrt(bd[k])) * S.netOpacity;
        if (la < 0.01) continue;
        lA[ln * 3] = xi; lA[ln * 3 + 1] = yi; lA[ln * 3 + 2] = zi;
        lB[ln * 3] = NP[j * 3]; lB[ln * 3 + 1] = NP[j * 3 + 1]; lB[ln * 3 + 2] = NP[j * 3 + 2];
        lD[ln * 2] = la; lD[ln * 2 + 1] = (key * 0.6180339887) % 1;
        ln++;
      }
    }
  }
  lastLinks = ln;
  linkG.g.instanceCount = ln;
  for (const nm of ['iA', 'iB', 'iD']) linkG.g.attributes[nm].needsUpdate = true;
  let nn = 0;
  if (S.netOn) {
    const nP = nodeG.arrays.iP, nD = nodeG.arrays.iD;
    for (let i = 0; i < nodeN; i++) {
      nP[i * 3] = NP[i * 3]; nP[i * 3 + 1] = NP[i * 3 + 1]; nP[i * 3 + 2] = NP[i * 3 + 2];
      nD[i * 2] = Math.min(1, NW[i] * S.netOpacity * 1.15); nD[i * 2 + 1] = NSZ[i];
    }
    nn = nodeN;
  }
  nodeG.g.instanceCount = nn;
  for (const nm of ['iP', 'iD']) nodeG.g.attributes[nm].needsUpdate = true;

  // pulses must complete a whole number of cycles per clip for the loop to stay seamless
  const T = S.duration;
  netU.uColor.value.set(S.netCol).convertLinearToSRGB();
  netU.uGlow.value = S.netGlow; netU.uPulse.value = S.netPulse; netU.uTime.value = t;
  netU.uSpeed.value = S.loop ? Math.max(1, Math.round(S.netPulseSpeed * T)) / T : S.netPulseSpeed;
  netU.uHalf.value = Math.max(0.02, S.netWidth) * 4;
}

function renderFrame(t) {
  tNow = t;
  lastCount = collect(t);
  writeInstances(lastCount);
  buildNetwork(t);
  renderer.render(scene, camera);
}
const renderNow = () => renderFrame(tNow);

/* ---------------------------------------------------------------- stage layout */
const stage = $('#stage'), stageWrap = $('#stageWrap'), guides = $('#guides');
const outSize = () => { const [w, h] = S.res.split('x').map(Number); return { w, h }; };

function layoutStage() {
  if (EXPORT) {
    renderer.setPixelRatio(1);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    aspect = window.innerWidth / window.innerHeight;
  } else {
    const { w: ow, h: oh } = outSize();
    aspect = ow / oh;
    const ww = Math.max(100, stageWrap.clientWidth - 32), wh = Math.max(100, stageWrap.clientHeight - 32);
    let w = ww, h = w / aspect;
    if (h > wh) { h = wh; w = h * aspect; }
    stage.style.width = Math.floor(w) + 'px';
    stage.style.height = Math.floor(h) + 'px';
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(Math.floor(w), Math.floor(h), false);
  }
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  drawGuides();
  renderNow();
}

/* ---------------------------------------------------------------- guides (preview only) */
const SVGNS = 'http://www.w3.org/2000/svg';
const sv = (name, attrs, parent) => { const e = document.createElementNS(SVGNS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
let handleDrag = null, srcDrag = null;

function drawGuides() {
  if (EXPORT) return;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  guides.setAttribute('viewBox', `0 0 ${sw} ${sh}`);
  guides.innerHTML = '';
  sources.forEach((s, i) => {
    const cx = s.x * sw, cy = s.y * sh, sel = i === selected;
    const g = sv('g', {}, guides);
    if (sel) {
      const th = S.angle * D2R, half = Math.min(S.cone, 89.9) * D2R;
      const len = Math.min(sw, sh) * 0.28;
      const pt = (a, l) => `${cx + Math.cos(a) * l},${cy - Math.sin(a) * l}`;
      if (S.cone > 0.5) sv('path', { d: `M ${cx},${cy} L ${pt(th - half, len)} A ${len} ${len} 0 0 0 ${pt(th + half, len)} Z`, fill: 'rgba(4,255,186,.13)', stroke: 'rgba(109,255,219,.55)', 'stroke-width': 1, 'stroke-dasharray': '4 4' }, g);
      const al = Math.min(sw, sh) * 0.2, hx = cx + Math.cos(th) * al, hy = cy - Math.sin(th) * al;
      sv('line', { x1: cx, y1: cy, x2: hx, y2: hy, stroke: '#04ffba', 'stroke-width': 2.5, 'stroke-linecap': 'round' }, g);
      const ah = sv('path', { d: `M ${hx},${hy} l ${-Math.cos(th - 0.45) * 14},${Math.sin(th - 0.45) * 14} M ${hx},${hy} l ${-Math.cos(th + 0.45) * 14},${Math.sin(th + 0.45) * 14}`, stroke: '#04ffba', 'stroke-width': 2.5, 'stroke-linecap': 'round', fill: 'none' }, g);
      const hh = sv('circle', { cx: hx, cy: hy, r: 13, fill: 'rgba(4,255,186,.001)', class: 'hit', 'data-handle': '1' }, g);
      hh.addEventListener('pointerdown', (e) => { e.stopPropagation(); handleDrag = { cx, cy }; hh.setPointerCapture(e.pointerId); });
      hh.addEventListener('pointermove', (e) => {
        if (!handleDrag) return;
        const r = stage.getBoundingClientRect();
        const dx = e.clientX - r.left - handleDrag.cx, dy = -(e.clientY - r.top - handleDrag.cy);
        let a = Math.atan2(dy, dx) / D2R; if (a < 0) a += 360;
        setValue('angle', Math.round(a));
      });
      hh.addEventListener('pointerup', () => { handleDrag = null; });
    }
    sv('circle', { cx, cy, r: 11, fill: 'none', stroke: sel ? '#04ffba' : 'rgba(238,243,250,.9)', 'stroke-width': 2 }, g);
    sv('circle', { cx, cy, r: 2.5, fill: sel ? '#04ffba' : '#eef3fa' }, g);
    sv('path', { d: `M ${cx - 19},${cy} H ${cx - 14} M ${cx + 14},${cy} H ${cx + 19} M ${cx},${cy - 19} V ${cy - 14} M ${cx},${cy + 14} V ${cy + 19}`, stroke: sel ? '#04ffba' : 'rgba(238,243,250,.9)', 'stroke-width': 2, 'stroke-linecap': 'round' }, g);
    if (sources.length > 1) {
      const tx = sv('text', { x: cx + 16, y: cy - 13, fill: '#f8fbff', 'font-size': 14, 'font-family': 'Rajdhani', 'font-weight': 700, 'paint-order': 'stroke', stroke: 'rgba(5,19,31,.8)', 'stroke-width': 3 }, g);
      tx.textContent = String(i + 1);
    }
    const hit = sv('circle', { cx, cy, r: 18, fill: 'rgba(0,0,0,.001)', class: 'hit' }, g);
    hit.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      selected = i; srcDrag = { i }; hit.setPointerCapture(e.pointerId); refreshSourcesUI(); drawGuides();
    });
    hit.addEventListener('pointermove', (e) => {
      if (!srcDrag || srcDrag.i !== i) return;
      const r = stage.getBoundingClientRect();
      sources[i].x = (e.clientX - r.left) / r.width; sources[i].y = (e.clientY - r.top) / r.height;
      drawGuides(); persist(); if (!playing) renderNow();
    });
    hit.addEventListener('pointerup', () => { srcDrag = null; });
  });
}

stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('.hit')) return;
  const r = stage.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if (e.shiftKey || e.altKey) {
    if (sources.length < 12) { sources.push({ x, y, z: 0 }); selected = sources.length - 1; }
  } else {
    sources[selected] = { ...sources[selected], x, y };
  }
  refreshSourcesUI(); drawGuides(); persist(); if (!playing) renderNow();
});

/* ---------------------------------------------------------------- panel UI */
const panel = $('#panel');
const refs = {};            // key → { set(value) }
const decimals = (step) => (String(step).split('.')[1] || '').length;

function onChange(k) {
  if (k === 'res') { layoutStage(); persist(); return; }
  if (['fov', 'cCol', 'oCol', 'bCol', 'gloss', 'lightAngle', 'key', 'ambient', 'rim'].includes(k)) applyLook();
  if (k === 'duration') { scrub.max = S.duration; if (tNow > S.duration) tNow = 0; updateTime(); }
  if (k === 'bgMode') applyBackdropMode();
  if (k === 'angle' || k === 'cone') drawGuides();
  persist();
  if (!playing) renderNow();
}
function setValue(k, v) { S[k] = v; if (refs[k]) refs[k].set(v); onChange(k); }

let persistTimer = 0;
function persist() {
  if (EXPORT) return;
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => saveStore(STORE_KEY, currentConfig()), 250);
}

function section(title, open) {
  const d = document.createElement('details'); d.open = !!open;
  const s = document.createElement('summary'); s.textContent = title;
  const b = document.createElement('div'); b.className = 'sec-body';
  d.append(s, b); panel.appendChild(d);

}
function rowRange(body, o) {
  const row = document.createElement('div'); row.className = 'row';

  const r = $('input[type=range]', row), n = $('input[type=number]', row);
  const set = (v) => { r.value = v; n.value = (+v).toFixed(dec); };
  set(S[o.k]);
  r.addEventListener('input', () => { S[o.k] = +r.value; n.value = (+r.value).toFixed(dec); onChange(o.k); });
  n.addEventListener('change', () => { const v = Math.min(+o.max, Math.max(+o.min, +n.value || 0)); S[o.k] = v; set(v); onChange(o.k); });

function rowSelect(body, o) {

}
function rowCheck(body, o) {

/* --- presets */
function buildPresets() {
  const body = section('Presets', false);
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<div class="top"><label class="name">Motion preset</label></div><select id="presetSel"></select>
    <div class="btnrow" style="margin-top:6px"><input type="text" id="presetName" placeholder="Name your preset…" style="flex:1;min-width:0"><button class="btn small" id="presetSave" type="button">Save</button><button class="btn small danger" id="presetDel" type="button">Delete</button></div>
    <div class="help">Presets change motion, spread and molecule shape. Colours, lighting and output are left alone.</div>`;
  body.appendChild(row);
  const sel = $('#presetSel', row);
  const user = () => loadStore(PRESET_KEY, {});
  const fill = () => {
    const u = user();
    sel.innerHTML = '<option value="">Choose…</option>' +
      Object.keys(PRESETS).map(n => `<option value="b:${n}">${n}</option>`).join('') +
      (Object.keys(u).length ? '<optgroup label="My presets">' + Object.keys(u).map(n => `<option value="u:${n}">${n}</option>`).join('') + '</optgroup>' : '');
  };
  fill();
  sel.addEventListener('change', () => {
    const [kind, ...rest] = sel.value.split(':'); const name = rest.join(':');
    if (!kind) return;
    const p = kind === 'b' ? PRESETS[name] : user()[name];
    if (!p) return;
    const base = {}; MOTION_KEYS.forEach(k => { base[k] = DEFAULTS[k]; });
    Object.assign(S, base, p);
    Object.keys(refs).forEach(k => refs[k].set(S[k]));
    drawGuides(); persist(); if (!playing) renderNow();
  });
  $('#presetSave', row).addEventListener('click', () => {
    const name = $('#presetName', row).value.trim().slice(0, 40);
    if (!name) { setStatus('Type a name for the preset first.', 'err'); return; }
    const u = user(); const p = {}; MOTION_KEYS.forEach(k => { p[k] = S[k]; }); u[name] = p; saveStore(PRESET_KEY, u);
    fill(); sel.value = 'u:' + name; setStatus(`Saved preset “${name}”.`, 'ok');
  });
  $('#presetDel', row).addEventListener('click', () => {
    const [kind, ...rest] = sel.value.split(':'); const name = rest.join(':');
    if (kind !== 'u') { setStatus('Only your own saved presets can be deleted.', 'err'); return; }
    const u = user(); delete u[name]; saveStore(PRESET_KEY, u); fill();
  });
}

/* --- sources */
let sourcesBody;
function buildSources() {
  sourcesBody = section('Sources', true);

}
function refreshSourcesUI() {
  if (!sourcesBody) return;
  sourcesBody.innerHTML = '';
  const chips = document.createElement('div'); chips.className = 'chips';
  sources.forEach((s, i) => {
    const c = document.createElement('span'); c.className = 'chip' + (i === selected ? ' sel' : '');

/* --- backdrop */
const bgImg = $('#bgImg'), bgVid = $('#bgVid');
function applyBackdropMode() { stage.dataset.bg = S.bgMode; }
function setBackdropMedia(file) {
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('video/')) {
    bgVid.src = url; bgVid.play().catch(() => {}); stage.dataset.kind = 'video';
  } else {
    bgImg.src = url; bgImg.dataset.user = '1'; stage.dataset.kind = 'image';

}
function buildBackdrop() {
  const body = section('Preview backdrop', false);

  rowRange(b, { k: 'fadeOut', label: 'Fade-out', min: 0, max: 6, step: 0.05, unit: 's' });
  rowRange(b, { k: 'gloss', label: 'Gloss', min: 0, max: 1, step: 0.01, help: 'Low = soft matte, high = shiny highlights.' });
  rowRange(b, { k: 'lightAngle', label: 'Light direction', min: 0, max: 360, step: 1, unit: '°' });
  rowRange(b, { k: 'key', label: 'Key light', min: 0, max: 5, step: 0.05 });
  rowRange(b, { k: 'ambient', label: 'Soft fill light', min: 0, max: 4, step: 0.05 });
  rowRange(b, { k: 'rim', label: 'Rim light', min: 0, max: 4, step: 0.05 });
  rowRange(b, { k: 'fov', label: 'Perspective', min: 8, max: 60, step: 1, unit: '°', help: 'Low = flatter, telephoto look. High = stronger size difference between near and far molecules.' });

  buildBackdrop();
  buildOutput();
}

/* ---------------------------------------------------------------- transport */
const scrub = $('#scrub'), timeReadout = $('#timeReadout'), statsEl = $('#stats');
const btnPlay = $('#btnPlay');
function updateTime() {
  scrub.value = tNow;
  timeReadout.textContent = `${tNow.toFixed(2)} / ${S.duration.toFixed(2)} s`;
  statsEl.textContent = `${lastCount} molecules` + (S.netOn ? ` · ${lastLinks} links` : '');
  statsEl.classList.toggle('warn', capHit);
  if (capHit) statsEl.textContent += ' (cap reached)';
}
function setPlaying(p) {
  playing = p; btnPlay.textContent = p ? 'Pause' : 'Play';
  if (stage.dataset.kind === 'video') { if (p) bgVid.play().catch(() => {}); else bgVid.pause(); }
}
btnPlay.addEventListener('click', () => setPlaying(!playing));
$('#btnRestart').addEventListener('click', () => { tNow = 0; if (stage.dataset.kind === 'video') bgVid.currentTime = 0; renderNow(); updateTime(); });
scrub.addEventListener('input', () => { tNow = +scrub.value; renderNow(); updateTime(); });
$('#chkGuides').addEventListener('change', (e) => stage.classList.toggle('hide-guides', !e.target.checked));
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test((e.target.tagName || ''))) { e.preventDefault(); setPlaying(!playing); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && !/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || '')) && sources.length > 1) {
    sources.splice(selected, 1); selected = Math.min(selected, sources.length - 1); refreshSourcesUI(); drawGuides(); persist();
  }
});

let lastTs = 0;
function tick(ts) {
  const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0; lastTs = ts;
  if (playing) {
    tNow += dt;
    if (tNow >= S.duration) tNow -= S.duration;
    renderFrame(tNow); updateTime();
  }
  requestAnimationFrame(tick);
}

/* ---------------------------------------------------------------- PNG + render */
const statusEl = $('#status');
let statusTimer = 0;
function setStatus(msg, kind) {
  statusEl.textContent = msg; statusEl.className = 'status' + (kind ? ' ' + kind : ''); statusEl.title = msg;
  clearTimeout(statusTimer);
  if (kind === 'ok' || kind === 'err') statusTimer = setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = ''; }, 6000);
}

$('#btnPng').addEventListener('click', () => {
  const { w, h } = outSize();
  const keepW = stage.clientWidth, keepH = stage.clientHeight, keepPR = renderer.getPixelRatio();
  renderer.setPixelRatio(1); renderer.setSize(w, h, false);
  const prevAspect = camera.aspect; camera.aspect = w / h; camera.updateProjectionMatrix();
  const keepAspect = aspect; aspect = w / h;
  renderFrame(tNow);
  canvas.toBlob((blob) => {
    renderer.setPixelRatio(keepPR); renderer.setSize(keepW, keepH, false);
    camera.aspect = prevAspect; camera.updateProjectionMatrix(); aspect = keepAspect; renderNow();
    if (!blob) { setStatus('Could not create the PNG.', 'err'); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${S.name || 'co2-molecules'}-${tNow.toFixed(2)}s.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    setStatus(`Saved a ${w}×${h} transparent PNG.`, 'ok');
  }, 'image/png');
});

const btnRender = $('#btnRender');
let rendering = false;
btnRender.addEventListener('click', async () => {
  if (rendering) return;
  let caps = null;
  try { const r = await fetch('/api/capabilities'); if (r.ok) caps = await r.json(); } catch (e) { /* not served by the studio */ }
  if (!caps || !caps.seekHook) {
    setStatus('Render server needs a restart to support this tool — stop it and run: node _render/server.js', 'err');
    return;
  }
  const { w, h } = outSize();
  const cfg = btoa(JSON.stringify(currentConfig())).replace(/\+/g, '-').replace(/\//g, '_');
  const qs = new URLSearchParams({ id: 'co2-overlay', duration: String(S.duration), fps: String(S.fps), w: String(w), h: String(h), name: S.name || 'co2-molecules', cfg });
  rendering = true; btnRender.disabled = true; setPlaying(false);
  const bar = $('#renderBar'), fill = bar ? $('i', bar) : null;
  if (bar) { bar.classList.add('on'); fill.style.width = '0%'; }
  setStatus('Starting render…');
  const es = new EventSource('/api/render?' + qs.toString());
  const finish = () => { es.close(); rendering = false; btnRender.disabled = false; if (bar) setTimeout(() => bar.classList.remove('on'), 1500); };
  es.onmessage = (e) => {
    setStatus(e.data);
    const m = /frame (\d+)\/(\d+)/.exec(e.data);
    if (m && fill) fill.style.width = (100 * (+m[1] / +m[2])).toFixed(1) + '%';
  };
  es.addEventListener('done', (e) => {
    const failed = /failed|already in progress/i.test(e.data);
    if (fill) fill.style.width = failed ? '0%' : '100%';
    setStatus(e.data, failed ? 'err' : 'ok'); finish();
  });
  es.onerror = () => { setStatus('Render connection lost — check the render server terminal.', 'err'); finish(); };
});

/* ---------------------------------------------------------------- backdrop default */
if (!EXPORT) {
  bgImg.addEventListener('error', () => { if (S.bgMode === 'media' && stage.dataset.kind === 'image' && !bgImg.dataset.user) { S.bgMode = 'checker'; applyBackdropMode(); if (refs.bgMode) refs.bgMode.set('checker'); } });
  bgImg.src = 'co2-overlay-reference.webp';
}

/* ---------------------------------------------------------------- boot */
applyLook();
if (!EXPORT) {
  buildPanel();
  applyBackdropMode();
  scrub.max = S.duration;
  new ResizeObserver(layoutStage).observe(stageWrap);
}
layoutStage();
if (!EXPORT) { updateTime(); requestAnimationFrame(tick); }

// Frame-exact capture hook for the render server (see _render/server.js).
window.__chartRealSeek = (ms) => { renderFrame(ms / 1000); return true; };
window.__chartResolve(true);
</script>
</body>
